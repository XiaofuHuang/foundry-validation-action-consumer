name: Foundry hosted-agent validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - azure.yaml
      - src/**

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run published Foundry validator
        id: foundry-validation
        uses: XiaofuHuang/foundry-hosted-agent-validator-action@v4.4.1
        with:
          github-token: ${{ github.token }}
          rules-file: https://raw.githubusercontent.com/microsoft/GitHub-Copilot-for-Azure/c0d66719b626af1706a0fc152ec5f3e53c8477d7/plugins/azure-skills/skills/microsoft-foundry/foundry-agent/validate/references/default-rules.yaml
