name: Foundry hosted-agent validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - azure.yaml
      - src/**

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run published Foundry validator
        id: foundry-validation
        uses: XiaofuHuang/foundry-hosted-agent-validator-action@dfd66e019d9bbf1addb2b243e9585704dcddca0e
        with:
          github-token: ${{ github.token }}
          agent-path: .

      - name: Create or update pull-request report comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_PATH: ${{ steps.foundry-validation.outputs.markdown-report }}
          VALIDATION_CONCLUSION: ${{ steps.foundry-validation.outputs.conclusion }}
          VALIDATION_SUMMARY: ${{ steps.foundry-validation.outputs.summary }}
        run: |
          set -euo pipefail
          marker='<!-- foundry-hosted-agent-validation -->'
          comment_file="$RUNNER_TEMP/foundry-validation-comment.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          {
            echo "$marker"
            echo "## Microsoft Foundry hosted-agent validation"
            echo
            echo "**Action result:** \`${VALIDATION_CONCLUSION:-failure}\`"
            if [[ -n "${VALIDATION_SUMMARY:-}" ]]; then
              echo
              echo "**Summary:** $VALIDATION_SUMMARY"
            fi
            echo
            echo "[View workflow run]($run_url)"
            echo
            if [[ -n "${REPORT_PATH:-}" && -f "$REPORT_PATH" ]]; then
              sed 's/@/\&#64;/g' "$REPORT_PATH"
            else
              echo "> The validator failed closed before producing a publishable report."
            fi
          } > "$comment_file"

          comment_id="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- foundry-hosted-agent-validation -->"))) | .id' |
              head -n 1
          )"

          if [[ -n "$comment_id" ]]; then
            jq -Rs '{body: .}' "$comment_file" |
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                --input - > /dev/null
          else
            jq -Rs '{body: .}' "$comment_file" |
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --input - > /dev/null
          fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-validation-reports
          path: .foundry/results/
          if-no-files-found: warn
          retention-days: 7
