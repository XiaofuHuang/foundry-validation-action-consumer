name: Foundry hosted-agent validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - azure.yaml
      - src/**

permissions:
  contents: read
  pull-requests: write
  copilot-requests: write

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run published Foundry validator
        id: foundry-validation
        uses: XiaofuHuang/foundry-hosted-agent-validator-action@454cea272f14232c8ef14377e672af943a16727b
        with:
          github-token: ${{ github.token }}
          agent-path: .
          comment-on-pr: "true"

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-validation-reports
          path: .foundry/results/
          if-no-files-found: warn
          retention-days: 7
